<head>

<title>Øvingsoppgaver i eksamensstil</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141a;--panel:#1a1e27;--p2:#20242f;--bd:#2b3140;--tx:#ebe6d9;--dim:#8d95a6;--gold:#e8b23d;--gr:#5fae7e;--rd:#d6545f;--on:#1a1508;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f3ea;--panel:#fff;--p2:#efeadb;--bd:#d8d2bf;--tx:#23201a;--dim:#6b6858;--gold:#b07d10;--gr:#2f7d52;--rd:#b8333f;--on:#fff}}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Spectral',Georgia,serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:40px 18px 100px}
h1{font-size:1.9rem;margin:0 0 8px}.sub{color:var(--dim);margin:0 0 24px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.score{font-family:'IBM Plex Mono',monospace;font-size:.9rem;margin-right:auto}.score b{color:var(--gold)}
.chip,button.sm{font-family:'IBM Plex Mono',monospace;font-size:.72rem;background:var(--p2);color:var(--dim);border:1px solid var(--bd);border-radius:99px;padding:5px 11px;cursor:pointer}
.chip.on{color:var(--on);background:var(--gold);border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:6px;padding:20px;margin:18px 0}
.card.done{border-color:var(--gold)}
.meta{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--dim);margin-bottom:8px}
.q{margin:0 0 14px;font-weight:600;white-space:pre-line}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-top:1px solid var(--bd);font-size:.95rem}
.row:first-of-type{border-top:0}
select,input[type=text],textarea{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:8px 10px;font-family:'IBM Plex Mono',monospace;font-size:.85rem;max-width:100%}
input[type=text],textarea{width:100%}textarea{min-height:90px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold)}
label.o{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--bd);border-radius:4px;margin:6px 0;cursor:pointer;font-size:.95rem}
label.o:hover{border-color:var(--gold)}
.ok{border-color:var(--gr)!important;background:color-mix(in srgb,var(--gr) 14%,transparent)}
.no{border-color:var(--rd)!important;background:color-mix(in srgb,var(--rd) 14%,transparent)}
button.go{font-family:'Spectral',serif;font-weight:600;background:var(--gold);color:var(--on);border:0;border-radius:4px;padding:10px 18px;margin-top:12px;cursor:pointer}
button.go:disabled{opacity:.45;cursor:default}
.fb{margin-top:14px;padding:12px;border-radius:4px;background:var(--p2);font-size:.92rem;color:var(--dim);display:none}
.fb b{color:var(--tx)}.fb .pt{font-family:'IBM Plex Mono',monospace;color:var(--gold)}
.fb .kw{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.75rem;padding:1px 7px;border-radius:99px;margin:2px 3px 2px 0;border:1px solid var(--bd)}
.kw.h{color:var(--gr);border-color:var(--gr)}.kw.m{color:var(--rd);border-color:var(--rd)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:.85rem;background:var(--p2);padding:10px;border-radius:4px;display:block;margin-bottom:10px;white-space:pre-wrap}
.final{display:none;text-align:center;padding:30px;border:1px solid var(--gold);border-radius:6px;margin-top:30px}
.final h2{margin:0 0 6px}
</style>
</head>

 var f=document.getElementById("final");if(Object.keys(done).length===Q.length){var p=Math.round(s/total*100);f.style.display="block";f.innerHTML="<h2>"+fmt(s)+" av "+fmt(total)+" poeng ("+p+" %)</h2><p style='color:var(--dim);margin:0'>"+(p>=80?"Sterkt! Du er godt i gang med eksamensformen.":p>=50?"Greit grunnlag - se gjennom forklaringene på det du bommet på.":"Les pensum på nytt og prøv igjen - nullstill øverst.")+"</p>"}else f.style.display="none"}
function finish(i,card,earned,fbHtml){var q=Q[i];earned=Math.max(0,Math.min(q.pts,earned));pts[i]=earned;done[i]=1;card.classList.add("done");
 var fb=card.querySelector(".fb");fb.style.display="block";fb.innerHTML="<span class='pt'>"+fmt(earned)+" / "+fmt(q.pts)+" p</span><br>"+fbHtml;
 card.querySelector("button.go").disabled=true;card.querySelectorAll("select,input,textarea").forEach(function(x){x.disabled=true});upd();if(card._kb){var nx=card.nextElementSibling;while(nx&&nx.style.display==="none")nx=nx.nextElementSibling;if(nx&&nx.classList.contains("card")){var f=nx.querySelector("select,input,textarea");if(f)f.focus({preventScroll:true});nx.scrollIntoView({behavior:"smooth",block:"start"})}}}
Q.forEach(function(q,i){total+=q.pts;
 var c=h("div","card");c.dataset.d=q.d;
 var m=h("div","meta");m.appendChild(h("span",null,"Oppgave "+(i+1)+" · "+q.d));m.appendChild(h("span",null,fmt(q.pts)+" p"));c.appendChild(m);
 c.appendChild(h("p","q",q.q));
 var body=h("div"),ctl=[];
 if(q.t==="match"){q.r.forEach(function(r){var row=h("div","row");row.appendChild(h("span",null,r[0]));var s=h("select");s.appendChild(new Option("Velg…",-1));var ix=q.o.map(function(o,k){return k});(q.o===YN?ix:sh(ix)).forEach(function(k){s.appendChild(new Option(q.o[k],k))});row.appendChild(s);ctl.push([s,row])});sh(ctl.slice()).forEach(function(x){body.appendChild(x[1])})}
 else if(q.t==="single"||q.t==="multi"){q.o.forEach(function(o,k){var l=h("label","o"),inp=h("input");inp.type=q.t==="single"?"radio":"checkbox";inp.name="q"+i;inp.value=k;l.appendChild(inp);l.appendChild(h("span",null,o));ctl.push([inp,l])});sh(ctl.slice()).forEach(function(x){body.appendChild(x[1])})}
 else if(q.t==="fill"){var inp=h("input");inp.type="text";inp.placeholder="Svar…";inp.autocomplete="off";body.appendChild(inp);ctl.push([inp])}
 else{var ta=h("textarea");ta.placeholder="Skriv svaret ditt her…";body.appendChild(ta);ctl.push([ta])}
 c.appendChild(body);
 var b=h("button","go","Sjekk svar");c.appendChild(b);c.appendChild(h("div","fb"));
 b.onclick=function(){var ex=q.e?"<br><b>Forklaring:</b> "+q.e:"",n=0,L=0;
  if(q.t==="match"){q.r.forEach(function(r,k){var v=+ctl[k][0].value,ok=v===r[1];if(ok)n++;ctl[k][1].classList.add(ok?"ok":"no");if(!ok)ctl[k][1].title="Riktig: "+q.o[r[1]]});
   var wrong=q.r.filter(function(r,k){return +ctl[k][0].value!==r[1]}).map(function(r){return r[0]+" → <b>"+q.o[r[1]]+"</b>"});
   finish(i,c,q.pts*n/q.r.length,(wrong.length?"Riktig svar på de du bommet på:<br>"+wrong.join("<br>")+"<br>":"Alt riktig!")+ex)}
  else if(q.t==="single"){var sel=ctl.filter(function(x){return x[0].checked})[0];if(!sel)return;var ok=+sel[0].value===q.a;ctl.forEach(function(x,k){if(k===q.a)x[1].classList.add("ok");else if(x[0].checked)x[1].classList.add("no")});finish(i,c,ok?q.pts:0,(ok?"Riktig.":"Ikke helt.")+ex)}
  else if(q.t==="multi"){var good=0,bad=0;ctl.forEach(function(x,k){var should=q.a.indexOf(k)>-1;if(should)x[1].classList.add("ok");if(x[0].checked){if(should)good++;else{bad++;x[1].classList.add("no")}}});
   finish(i,c,q.pts*Math.max(0,good-bad)/q.a.length,(good===q.a.length&&!bad?"Riktig.":"Grønn = riktig alternativ, rød = feil valg.")+ex)}
  else if(q.t==="fill"){var v=norm(ctl[0][0].value);if(!v)return;var z=function(x){return norm(x).replace(/[\s$]/g,"")},vv=z(ctl[0][0].value),ok=q.a.some(function(a){return z(a)===vv});finish(i,c,ok?q.pts:0,(ok?"Riktig.":"Riktig svar: <b>"+q.a[0]+"</b>")+ex)}
  else{var tx=norm(ctl[0][0].value);if(!tx)return;var hits=q.kw.map(function(g){return g.some(function(w){return tx.indexOf(w)>-1})}),nh=hits.filter(Boolean).length;
   var tags=q.kw.map(function(g,k){return "<span class='kw "+(hits[k]?"h":"m")+"'>"+g[0]+"</span>"}).join("");
   finish(i,c,Math.round(q.pts*nh/q.kw.length*2)/2,"Nøkkelbegreper (grønn = funnet i svaret ditt, rød = mangler; bruk gjerne synonymer):<br>"+tags+"<br><b>Eksempel på godt svar:</b> "+q.m+"<br><i>Automatisk poengsum er et grovt anslag - vurder selv om svaret ditt dekker innholdet.</i>")}
 };
 c.addEventListener("keydown",function(e){if(e.key!=="Enter"||e.target.tagName==="BUTTON"||b.disabled)return;if(e.target.tagName==="TEXTAREA"&&!(e.ctrlKey||e.metaKey))return;e.preventDefault();c._kb=1;b.click()});
 list.appendChild(c)});

document.getElementById("reset").onclick=function(){location.reload()};
upd();
})();
